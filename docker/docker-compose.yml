version : '3.8'

# =============================================================================
# SkyWalking 全链路监控接入说明：
# 所有 Java 服务共享一份 agent（./skywalking/agent），通过环境变量
# JAVA_TOOL_OPTIONS 注入 -javaagent，无需修改各服务 Dockerfile；
# SW_COLLECTOR_BACKEND_SERVICES 指向 OAP，SW_AGENT_SERVICE_NAME 为链路服务名。
# =============================================================================
services:
  spzx-nacos:
    container_name: spzx-nacos
    image: nacos/nacos-server
    build:
      context: ./nacos
    environment:
      - MODE=standalone
    volumes:
      - ./nacos/logs/:/home/nacos/logs
      - ./nacos/conf/application.properties:/home/nacos/conf/application.properties
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    depends_on:
      - spzx-mysql
  spzx-mysql:
    container_name: spzx-mysql
    image: mysql:5.7
    build:
      context: ./mysql
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/conf:/etc/mysql/conf.d
      - ./mysql/logs:/logs
      - ./mysql/data:/var/lib/mysql
    command: [
          'mysqld',
          '--innodb-buffer-pool-size=80M',
          '--character-set-server=utf8mb4',
          '--collation-server=utf8mb4_unicode_ci',
          '--default-time-zone=+8:00',
          '--lower-case-table-names=1'
        ]
    environment:
      MYSQL_DATABASE: 'ry-cloud'
      MYSQL_ROOT_PASSWORD: password
  spzx-redis:
    container_name: spzx-redis
    image: redis
    build:
      context: ./redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/conf/redis.conf:/home/spzx/redis/redis.conf
      - ./redis/data:/data
    command: redis-server /home/spzx/redis/redis.conf
  spzx-nginx:
    container_name: spzx-nginx
    image: nginx
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/html/dist:/home/spzx/projects/spzx-ui
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/logs:/var/log/nginx
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - spzx-gateway
    links:
      - spzx-gateway

  # ======================= SkyWalking 全链路监控 =======================
  spzx-skywalking-oap:
    container_name: spzx-skywalking-oap
    image: apache/skywalking-oap-server:9.6.0
    user: root   # 官方镜像默认 skywalking 用户(UID 11800)，无法写宿主机 bind mount，开发环境以 root 运行
    environment:
      - SW_STORAGE=h2
      - SW_STORAGE_H2_URL=jdbc:h2:file:/skywalking/data/skywalking-oap-db
      - TZ=Asia/Shanghai
    volumes:
      - ./skywalking/oap-data:/skywalking/data
    ports:
      - "11800:11800"   # gRPC: agent 上报链路数据
      - "12800:12800"   # HTTP: UI / 第三方查询接口
    restart: unless-stopped
  spzx-skywalking-ui:
    container_name: spzx-skywalking-ui
    image: apache/skywalking-ui:9.6.0
    environment:
      - SW_OAP_ADDRESS=http://spzx-skywalking-oap:12800
      - TZ=Asia/Shanghai
    ports:
      - "18080:8080"    # 宿主机 18080 (8080 已被网关占用)
    depends_on:
      - spzx-skywalking-oap
    restart: unless-stopped

  spzx-gateway:
    container_name: spzx-gateway
    build:
      context: ./spzx/gateway
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./skywalking/agent:/skywalking/agent:ro
    environment:
      - SW_AGENT_SERVICE_NAME=spzx-gateway
      - JAVA_TOOL_OPTIONS=-javaagent:/skywalking/agent/skywalking-agent.jar
      - SW_COLLECTOR_BACKEND_SERVICES=spzx-skywalking-oap:11800
      - TZ=Asia/Shanghai
    depends_on:
      - spzx-redis
      - spzx-skywalking-oap
    links:
      - spzx-redis
  spzx-auth:
    container_name: spzx-auth
    build:
      context: ./spzx/auth
      dockerfile: dockerfile
    ports:
      - "9200:9200"
    volumes:
      - ./skywalking/agent:/skywalking/agent:ro
    environment:
      - SW_AGENT_SERVICE_NAME=spzx-auth
      - JAVA_TOOL_OPTIONS=-javaagent:/skywalking/agent/skywalking-agent.jar
      - SW_COLLECTOR_BACKEND_SERVICES=spzx-skywalking-oap:11800
      - TZ=Asia/Shanghai
    depends_on:
      - spzx-redis
      - spzx-skywalking-oap
    links:
      - spzx-redis
  spzx-modules-system:
    container_name: spzx-modules-system
    build:
      context: ./spzx/modules/system
      dockerfile: dockerfile
    ports:
      - "9201:9201"
    volumes:
      - ./skywalking/agent:/skywalking/agent:ro
    environment:
      - SW_AGENT_SERVICE_NAME=spzx-system
      - JAVA_TOOL_OPTIONS=-javaagent:/skywalking/agent/skywalking-agent.jar
      - SW_COLLECTOR_BACKEND_SERVICES=spzx-skywalking-oap:11800
      - TZ=Asia/Shanghai
    depends_on:
      - spzx-redis
      - spzx-mysql
      - spzx-skywalking-oap
    links:
      - spzx-redis
      - spzx-mysql
  spzx-modules-gen:
    container_name: spzx-modules-gen
    build:
      context: ./spzx/modules/gen
      dockerfile: dockerfile
    ports:
      - "9202:9202"
    volumes:
      - ./skywalking/agent:/skywalking/agent:ro
    environment:
      - SW_AGENT_SERVICE_NAME=spzx-gen
      - JAVA_TOOL_OPTIONS=-javaagent:/skywalking/agent/skywalking-agent.jar
      - SW_COLLECTOR_BACKEND_SERVICES=spzx-skywalking-oap:11800
      - TZ=Asia/Shanghai
    depends_on:
      - spzx-mysql
      - spzx-skywalking-oap
    links:
      - spzx-mysql
  spzx-modules-job:
    container_name: spzx-modules-job
    build:
      context: ./spzx/modules/job
      dockerfile: dockerfile
    ports:
      - "9203:9203"
    volumes:
      - ./skywalking/agent:/skywalking/agent:ro
    environment:
      - SW_AGENT_SERVICE_NAME=spzx-job
      - JAVA_TOOL_OPTIONS=-javaagent:/skywalking/agent/skywalking-agent.jar
      - SW_COLLECTOR_BACKEND_SERVICES=spzx-skywalking-oap:11800
      - TZ=Asia/Shanghai
    depends_on:
      - spzx-mysql
      - spzx-skywalking-oap
    links:
      - spzx-mysql
  spzx-modules-file:
    container_name: spzx-modules-file
    build:
      context: ./spzx/modules/file
      dockerfile: dockerfile
    ports:
      - "9300:9300"
    volumes:
      - ./spzx/uploadPath:/home/spzx/uploadPath
      - ./skywalking/agent:/skywalking/agent:ro
    environment:
      - SW_AGENT_SERVICE_NAME=spzx-file
      - JAVA_TOOL_OPTIONS=-javaagent:/skywalking/agent/skywalking-agent.jar
      - SW_COLLECTOR_BACKEND_SERVICES=spzx-skywalking-oap:11800
      - TZ=Asia/Shanghai
    depends_on:
      - spzx-skywalking-oap
  spzx-visual-monitor:
    container_name: spzx-visual-monitor
    build:
      context: ./spzx/visual/monitor
      dockerfile: dockerfile
    ports:
      - "9100:9100"
    volumes:
      - ./skywalking/agent:/skywalking/agent:ro
    environment:
      - SW_AGENT_SERVICE_NAME=spzx-monitor
      - JAVA_TOOL_OPTIONS=-javaagent:/skywalking/agent/skywalking-agent.jar
      - SW_COLLECTOR_BACKEND_SERVICES=spzx-skywalking-oap:11800
      - TZ=Asia/Shanghai
    depends_on:
      - spzx-skywalking-oap
