# Tomcat
server:
  port: 9209

# Spring
spring:
  application:
    # 应用名称
    name: spzx-cart
  profiles:
    # 环境配置
    active: dev
  main:
    allow-bean-definition-overriding: true #当遇到同样名字的时候，是否允许覆盖注册
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 192.168.6.100:8848
      config:
        # 配置中心地址
        server-addr: 192.168.6.100:8848
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
# 除了拉取共享配置，还需要拉取默认规则的配置：${prefix}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
# ${prefix}  prefix前缀没有配置，取应用名称。
# dataId = spzx-cart-dev.yml